<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <h1 class="text-2xl font-bold underline bg-orange-200 p-10">Calculator</h1>
    <div class="mt-20 bg-orange-300 text-2xl">
      <div class="grid grid-cols-4">
        <button
          id="num"
          class="border border-black-100 p-20 hover:bg-orange-100 active:bg-orange-300"
        >
          1
        </button>
        <button
          id="num"
          class="border border-black-100 p-20 hover:bg-orange-100 active:bg-orange-300"
        >
          2
        </button>
        <button
          id="num"
          onclick="printNum()"
          class="border border-black-100 p-20 hover:bg-orange-100 active:bg-orange-300"
        >
          3
        </button>
        <button
          id="num"
          class="border border-black-100 p-20 bg-green-100 hover:bg-white active:bg-green-100"
        >
          +
        </button>
      </div>
      <div class="grid grid-cols-4">
        <button
          id="num"
          class="border border-black-100 p-20 hover:bg-orange-100 active:bg-orange-300"
        >
          4
        </button>
        <button
          id="num"
          class="border border-black-100 p-20 hover:bg-orange-100 active:bg-orange-300"
        >
          5
        </button>
        <button
          id="num"
          class="border border-black-100 p-20 hover:bg-orange-100 active:bg-orange-300"
        >
          6
        </button>
        <button
          id="num"
          class="border border-black-100 p-20 bg-green-100 hover:bg-white active:bg-green-100"
        >
          -
        </button>
      </div>
      <div class="grid grid-cols-4">
        <button
          id="num"
          class="border border-black-100 p-20 hover:bg-orange-100 active:bg-orange-300"
        >
          7
        </button>
        <button
          id="num"
          class="border border-black-100 p-20 hover:bg-orange-100 active:bg-orange-300"
        >
          8
        </button>
        <button
          id="num"
          class="border border-black-100 p-20 hover:bg-orange-100 active:bg-orange-300"
        >
          9
        </button>
        <button
          id="num"
          class="border border-black-100 p-20 bg-green-100 hover:bg-white active:bg-green-100"
        >
          x
        </button>
      </div>
      <div class="grid grid-cols-4 bg-green-100">
        <button
          id="num"
          class="border border-black-100 p-20 hover:bg-white active:bg-green-100"
        >
          0
        </button>
        <button
          id="num"
          class="border border-black-100 p-20 hover:bg-white active:bg-green-100"
        >
          .
        </button>
        <button
          id="num"
          class="border border-black-100 p-20 hover:bg-white active:bg-green-100"
        >
          =
        </button>
        <button
          id="num"
          class="border border-black-100 p-20 hover:bg-white active:bg-green-100"
        >
          %
        </button>
      </div>
    </div>
    <div id="display"></div>
    <script>
      let numbers = document.getElementById("num");
      let display = document.getElementById("display");

      const printNum = () => {
        display.textContent = numbers.value;
        display.push(numbers.value);
      };
    </script>
  </body>
</html>
